<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>İrəvanı Alırıq</title>

  #test{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:6px;z-index:9}
  #test button{padding:10px 14px;font-size:15px;border:0;border-radius:6px;background:#333;color:#fff;cursor:pointer}
  #test button:hover{background:#555}
  body.obs #test{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="test">
  <button id="like">1 · ❤ Like</button>
  <button data-c="1">2 · 🌹 Gül</button>
  <button data-c="10">3 · 💣 Top</button>
  <button data-c="100">4 · 🚀 Raket</button>
  <button data-c="29999">5 · 🦁 Şir</button>
  <button data-g="Ice Cream Cone" data-c="1">6 · 🍦 Süvari</button>
  <button data-g="Finger Heart" data-c="5">7 · 🫰 5 əsgər</button>
  <button data-g="Perfume" data-c="20">8 · 💐 Taran</button>
  <button data-g="Galaxy" data-c="1000">9 · 🌌 Ox yağışı</button>
  <button onclick="onFollow({ user: rnd() })">F · ➕ Follow</button>
  <button onclick="onShare({ user: rnd() })">S · 🔗 Paylaşma</button>
  <button onclick="onChat({ user: rnd() + ((Math.random() * 99) | 0) })">C · 💬 Şərh</button>
  <button onclick="onJoin({ user: 'Qonaq' + ((Math.random() * 999) | 0) })">J · 👋 Qoşuldu</button>
  <button onclick="onGift({ user: rnd(), coins: 34999, giftName: 'Universe' })">U · 🦅 Simurq</button>
  <button onclick="chestT = 0">G · 💰 Sandıq</button>
  <button id="mute" onclick="this.textContent = SFX.toggle() ? '🔇 Səs' : '🔊 Səs'">🔊 Səs</button>
  <button id="obs">Gizlət</button>
</div>
<script>
// ================= AYARLAR =================
const CFG = {
  castleLives: 50,         // qalanın canı (raundda yenidən hesablanır)
  // ---- Raund artımı ----
  baseLives: 50,           // 1-ci raund qalanın canı
  livesPerRound: 25,       // hər raund +25 can (50 → 75 → 100 ...)
  maxLivesCap: 250,
  baseTankHp: 15, tankHpPerRound: 5,
  stageFrac: [.8, .6, .4], // oxçu / qala topu / tank — canın hansı hissəsində
  regenAfter: 12,          // bu qədər saniyə zərbə olmasa qala bərpa olunmağa başlayır
  regenEvery: 2,           // hər 2 saniyə +1 can
  defenderEvery: .6,       // müdafiəçi spawn intervalı (san)
  defenderGroup: 2,        // hər dəfə neçə müdafiəçi çıxır
  maxDefenders: 60,
  autoSoldierEvery: 2.5,   // pulsuz "adi" əsgər intervalı
  nukeCastleDmg: 10,
  victoryPause: 11,        // qala alınandan sonra yeni raund (san)
  roundTime: 300,          // qalanı almaq üçün vaxt (san)
  // Müdafiə səviyyələri (qala canına görə)
  stageArchers: 40,        // ≤40 can → divarda oxçular
  stageCannons: 30,        // ≤30 can → qala top atır
  stageTank: 20,           // ≤20 can → tank çıxır
  rageEvery: [2.2, .9],    // qala top intervalı: 30 candan → 0 cana doğru sürətlənir
  rageBurst: 10,           // hər yeni səviyyədə dərhal çıxan əlavə qüvvə
  tankHp: 15,              // tankın canı
  tankRespawn: 25,         // tank məhv olsa neçə saniyədən sonra yenisi gəlir
  rageSpawnMul: 1.6,       // hücum rejimində müdafiəçi daha tez çıxır
  rageMaxDefenders: 85,
  archerEvery: .35,        // divardakı oxçuların atış intervalı
};
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
if (new URLSearchParams(location.search).has('obs')) document.body.classList.add('obs');

// Qala geometriyası (ortada)
const CASTLE = { x: 190, y: 560, w: 700, h: 420 };
const GATE_Y = CASTLE.y + CASTLE.h;   // darvaza xətti

// ---- Qala zədəsi: hər hissə müəyyən zədə həddində (th, 0..1) görünür ----
const CASTLE_PAD = 60;
const castleCv = document.createElement('canvas');
castleCv.width = CASTLE.w + CASTLE_PAD * 2; castleCv.height = CASTLE.h + CASTLE_PAD * 2;
const castleCtx = castleCv.getContext('2d');
let seed = 7; const srnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const MERLONS = Array.from({ length: 12 }, (_, i) => ({ i, th: .1 + srnd() * .7 }));
const CRACKS = Array.from({ length: 16 }, (_, i) => ({ th: (i + 1) / 20, x: 40 + srnd() * (CASTLE.w - 80), y: 120 + srnd() * (CASTLE.h - 220),
  pts: Array.from({ length: 4 }, (_, k) => [(srnd() - .5) * 50 * (k + 1), 18 * (k + 1)]) }));
const HOLES = [
  [.2, 250, 230, 34], [.3, 520, 300, 40], [.4, 130, 340, 46], [.5, 600, 200, 44], [.58, 380, 360, 38],
  [.66, 40, 180, 50], [.74, 660, 340, 55], [.82, 300, 210, 58], [.9, 470, 230, 66], [.96, 200, 120, 70],
].map(([th, hx, hy, r]) => ({ th, x: hx, y: hy, r, shape: Array.from({ length: 11 }, (_, i) => [i / 11 * 6.283, .6 + srnd() * .55]) }));
const TOWER_BREAKS = [[.45, -30, 70], [.7, CASTLE.w - 90, 150]].map(([th, tx, depth]) => ({ th, x: tx,
  edge: Array.from({ length: 7 }, (_, i) => [i * 20, depth * (.4 + srnd() * .6)]) }));

// ================= SƏSLƏR (Web Audio, fayl yoxdur) =================
const SFX = (() => {
  let ac = null, master = null, muted = false; const last = {};
  function init() { if (ac) { ac.resume(); return; }
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .6; master.connect(ac.destination); }
  try { init(); } catch (_) {}
  ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { try { init(); } catch (_) {} }));
  const ok = (k, gap) => { if (!ac || muted || ac.state !== 'running') return false;
    const n = ac.currentTime; if (last[k] && n - last[k] < gap) return false; last[k] = n; return true; };
  function noise(dur) { const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const s = ac.createBufferSource(); s.buffer = b; return s; }
  function env(node, vol, a, d, t0 = ac.currentTime) { const g = ac.createGain();
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + a); g.gain.exponentialRampToValueAtTime(.001, t0 + a + d);
    node.connect(g); g.connect(master); return g; }
  function tone(type, f1, f2, vol, dur, t0 = ac.currentTime) { const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f1, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    env(o, vol, .005, dur, t0); o.start(t0); o.stop(t0 + dur + .05); }
  function filtNoise(type, freq, vol, dur, t0 = ac.currentTime, q = 1) { const n = noise(dur + .1), f = ac.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q; n.connect(f); env(f, vol, .005, dur, t0); n.start(t0); }
  return {
    sword() { if (!ok('sword', .09)) return; tone('square', 2400 + Math.random() * 800, 1800, .06, .08); filtNoise('highpass', 5000, .12, .06); },
    castle() { if (!ok('castle', .12)) return; tone('sine', 120, 50, .35, .2); filtNoise('lowpass', 600, .25, .15); },
    spawn() { if (!ok('spawn', .05)) return; tone('triangle', 500, 900, .12, .1); },
    hero() { if (!ok('hero', .1)) return; const t = ac.currentTime; [523, 659, 784].forEach((f, i) => tone('square', f, 0, .1, .12, t + i * .08)); },
    cannon() { if (!ok('cannon', .05)) return; tone('sine', 90, 30, .7, .5); filtNoise('lowpass', 900, .6, .35); },
    whoosh() { if (!ok('whoosh', .05)) return; const n = noise(1.9), f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3;
      f.frequency.setValueAtTime(300, ac.currentTime); f.frequency.exponentialRampToValueAtTime(3000, ac.currentTime + 1.8);
      n.connect(f); env(f, .3, .5, 1.3); n.start(); },
    boom(big) { if (!ok('boom', .04)) return; tone('sine', big ? 70 : 110, 25, big ? .9 : .6, big ? .9 : .5); filtNoise('lowpass', big ? 700 : 1200, big ? .8 : .5, big ? 1 : .5); },
    siren() { if (!ac || muted) return; const o = ac.createOscillator(), t = ac.currentTime; o.type = 'sawtooth';
      for (let i = 0; i < 4; i++) { o.frequency.setValueAtTime(500, t + i * .5); o.frequency.linearRampToValueAtTime(900, t + i * .5 + .45); }
      const g = env(o, .18, .05, 2); o.start(t); o.stop(t + 2.1); },
    nuke() { if (!ac || muted) return; tone('sine', 55, 18, 1, 3); filtNoise('lowpass', 400, 1, 3.2); filtNoise('lowpass', 2500, .5, .8); },
    heart() { if (!ac || muted) return; const t = ac.currentTime; tone('sine', 70, 40, .7, .12, t); tone('sine', 60, 35, .5, .12, t + .18); },
    fail() { if (!ac || muted) return; const t = ac.currentTime; [392, 349, 311, 262].forEach((f, i) => tone('sawtooth', f, 0, .1, .45, t + i * .4)); },
    fanfare() { if (!ac || muted) return; const t = ac.currentTime;
      [[392, .2], [392, .2], [392, .2], [523, .6], [659, .3], [784, .9]].reduce((tt, [f, d]) => {
        tone('square', f, 0, .12, d, tt); tone('triangle', f / 2, 0, .15, d, tt); return tt + d * .9; }, t + .1); },
    toggle() { muted = !muted; return muted; },
  };
})();

// ================= VƏZİYYƏT =================
let units = [], shots = [], booms = [], parts = [], floaters = [], nukeQueue = [], nuke = null;
let roundT = 0, idleT = 0, regenT = 0, regenOn = false, lastWin = null;
// Ümumi statistika (yayım yenidən başlasa da qalsın)
const STATS = (() => { try { return JSON.parse(localStorage.getItem('irevan_stats')) || { conquered: 0, best: 0 }; } catch (_) { return { conquered: 0, best: 0 }; } })();
const saveStats = () => { try { localStorage.setItem('irevan_stats', JSON.stringify(STATS)); } catch (_) {} };
const fmtT = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let tanks = [], tankT = 0, stage = 0, bannerMsg = null;
let archerT = 0, capHero = null, timeLeft = 0, rage = false, rageT = 0, rageBanner = 0, lastHitter = null, heartT = 0;
let introT = 0, lives, state, stateT, flagY, azFlagY, shake = 0, defT = 0, autoT = 0, round = 1;
const board = new Map();       // ad -> {name, pic, kills, coins, atom}
const picCache = new Map();

function reset() {
  units = []; shots = []; cannons = []; rams = []; booms = []; parts = []; floaters = [];
  // raunda görə qala güclənir
  CFG.castleLives = Math.min(CFG.maxLivesCap, CFG.baseLives + (round - 1) * CFG.livesPerRound);
  [CFG.stageArchers, CFG.stageCannons, CFG.stageTank] = CFG.stageFrac.map(f => Math.round(CFG.castleLives * f));
  CFG.tankHp = CFG.baseTankHp + (round - 1) * CFG.tankHpPerRound;
  lives = CFG.castleLives; state = 'play'; stateT = 0; roundT = 0; idleT = 0; regenT = 0; regenOn = false;
  flagY = 0; azFlagY = 1; introT = 0;
  tanks = []; tankT = 0; stage = 0; bannerMsg = null; decal.clearRect(0, 0, W, H);
  combo = 0; comboT = 0; fury = 0; pickWeather();
  firstBlood = false; announces = []; chest = null; chestT = 40; simurq = null;
  corpses = [];
  timeLeft = CFG.roundTime; rage = false; rageT = 0; rageBanner = 0; lastHitter = null;
  board.clear();
}

// ================= PROFİL ŞƏKLİ =================
// Real şəkil URL-i gəlsə yüklənir, yoxsa ad hərfi ilə rəngli dairə.
function getPic(name, url) {
  const key = name + '|' + (url || '');
  if (picCache.has(key)) return picCache.get(key);
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  g.fillStyle = `hsl(${h},65%,45%)`; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#fff'; g.font = 'bold 70px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(name[0].toUpperCase(), 64, 68);
  picCache.set(key, c);
  // crossOrigin qoymuruq: TikTok CDN CORS başlığı vermir; biz piksel oxumuruq, sadəcə çəkirik
  if (url) { const im = new Image(); im.referrerPolicy = 'no-referrer';
    im.onload = () => { g.clearRect(0,0,128,128); g.drawImage(im, 0, 0, 128, 128); }; im.src = url; }
  return c;
}
function drawPic(pic, x, y, r, ring = '#fff') {
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip();
  ctx.drawImage(pic, x - r, y - r, r * 2, r * 2); ctx.restore();
  ctx.lineWidth = Math.max(3, r / 8); ctx.strokeStyle = ring; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
}

// ================= BAYRAQLAR =================
function azFlag(x, y, w, h) {
  const s = h / 3;
  ctx.fillStyle = '#00B5E2'; ctx.fillRect(x, y, w, s);
  ctx.fillStyle = '#EF3340'; ctx.fillRect(x, y + s, w, s);
  ctx.fillStyle = '#509E2F'; ctx.fillRect(x, y + 2 * s, w, s);
  const cx = x + w * 0.47, cy = y + h / 2, r = s * 0.36;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#EF3340'; ctx.beginPath(); ctx.arc(cx + r * 0.25, cy, r * 0.8, 0, 7); ctx.fill();
  star8(cx + r * 1.05, cy, r * 0.45, '#fff');
}
function star8(cx, cy, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
  ctx.fill();
}
// Uydurma "qarnizon" bayrağı — heç bir real dövlətə aid deyil
function enemyFlag(x, y, w, h) {
  ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#6d6d6d'; ctx.fillRect(x, y + h * 0.42, w, h * 0.16);
  ctx.fillStyle = '#9a9a9a'; ctx.beginPath();
  const cx = x + w / 2, cy = y + h / 2, r = h * 0.3;
  ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy); ctx.fill();
  ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.35, 0, 7); ctx.fill();
}

// ================= VAHİDLƏR =================
// side: 'az' (hücum, aşağıdan yuxarı) | 'en' (müdafiə, qaladan aşağı)
function spawnUnit(side, name, pic) {
  const u = {
    side, name, pic, hp: side === 'az' ? (pic ? 6 : 2) : 2,   // gül əsgəri 6 can, like əsgəri 2
    x: side === 'az' ? 120 + Math.random() * 840 : CASTLE.x + CASTLE.w / 2 + (Math.random() - .5) * 160,
    y: side === 'az' ? H - 120 : GATE_Y - 10,
    spd: side === 'az' ? 70 + Math.random() * 25 : 60 + Math.random() * 20,
    cd: 0, swing: 0, walk: Math.random() * 6, dead: false,
  };
  if (side === 'az' && name) { const r = rankOf(name); u.rank = r[1]; u.hp += r[2]; }   // rütbə: əlavə can
  units.push(u); return u;
}
function killUnit(u, by) {
  if (u.dead) return; u.dead = true; if (!u.cav) addCorpse(u);
  for (let i = 0; i < 8; i++) parts.push({ x: u.x, y: u.y - 30, vx: (Math.random() - .5) * 300, vy: -Math.random() * 300, t: .7, c: '#888' });
  if (u.side === 'en' && by) {
    if (!firstBlood && state === 'play') { firstBlood = true; announce(`🩸 İLK QAN: ${by}!`, '#ff5252'); }
    if (board.has(by)) { const b = board.get(by); b.kills++;
      const m = { 5: 'QƏHRƏMAN', 15: 'DÖYÜŞ USTASI', 30: 'DƏHŞƏTLİ', 50: 'ƏFSANƏ' }[b.kills];
      if (m) announce(`⚔ ${by}: ${b.kills} düşmən — ${m}!`, '#ffd34d'); }
  }
}
// Böyük elan (ekranın ortası, növbə ilə)
let announces = [], firstBlood = false;
function announce(text, color) { announces.push({ text, color, t: 2.2 }); if (announces.length > 3) announces.shift(); }
function drawAnnounce(dt) {
  const a = announces[0]; if (!a) return;
  a.t -= dt; if (a.t <= 0) { announces.shift(); return; }
  const k = a.t > 1.9 ? (2.2 - a.t) / .3 : a.t < .3 ? a.t / .3 : 1, s = .7 + .3 * Math.min(1, k * 1.2);
  ctx.globalAlpha = Math.max(0, k); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 420, W, 90);
  ctx.save(); ctx.translate(W / 2, 465); ctx.scale(s, s); txt(a.text, 0, 0, 52, a.color); ctx.restore(); ctx.globalAlpha = 1;
}
function hitCastle(n, by) {
  if (state !== 'play') return;
  lives = Math.max(0, lives - n); shake = Math.max(shake, 8 + n); SFX.castle();
  lastHitter = by || null;   // son zərbəni vuran (like əsgəri üçün null)
  idleT = 0; if (regenOn) { regenOn = false; }
  if (by && board.has(by)) board.get(by).dmg += n;   // töhfə: qalaya vurulan zərər
  // daş qırıntıları tökülür
  for (let i = 0; i < 4 + n * 3; i++) parts.push({ x: CASTLE.x + 40 + Math.random() * (CASTLE.w - 80), y: CASTLE.y + 60 + Math.random() * 250,
    vx: (Math.random() - .5) * 260, vy: -100 - Math.random() * 250, t: 1.4, c: ['#a8875a', '#7d6440', '#c9a26b'][(Math.random() * 3) | 0], sz: 8 + Math.random() * 14 });
  floaters.push({ x: W / 2 + (Math.random() - .5) * 300, y: CASTLE.y + 80, txt: (by && n >= 2 ? by.slice(0, 10) + ' ' : '') + '-' + n, t: 1.2, c: '#ff4040', s: n >= 2 ? 52 : 64 });
  if (lives === 0) { capture(); return; }
  checkStage();
}
const STAGES = [
  null,
  ['🏹 OXÇULAR DİVARDA!', 'Qala müdafiəyə keçdi'],
  ['💣 QALA TOP ATIR!', 'Qüllələrdən od mərmiləri'],
  ['🛡 TANK GƏLİR!', 'Qala son gücünü toplayır'],
];
function checkStage() {
  if (lives <= 0) return;
  const s = lives <= CFG.stageTank ? 3 : lives <= CFG.stageCannons ? 2 : lives <= CFG.stageArchers ? 1 : 0;
  while (stage < s) {
    stage++; rage = true; rageBanner = 3.5; bannerMsg = STAGES[stage]; SFX.siren();
    for (let i = 0; i < CFG.rageBurst; i++) setTimeout(() => state === 'play' && spawnUnit('en', null, null), i * 120);
    if (stage === 3) spawnTank();
  }
}

// ================= HƏDİYYƏ =================
function addBoard(name, pic, coins) {
  if (!board.has(name)) board.set(name, { name, pic, kills: 0, coins: 0, dmg: 0, atom: false });
  const b = board.get(name); b.coins += coins; return b;
}
// combo: bridge "count" göndərir (məs. 10 gül) — hər birini ayrıca, kiçik fasilə ilə işləyirik
function onGift(e) {
  const mult = state === 'play' ? chestBonus(e.user) : 1;   // qızıl sandıq: x2
  const n = Math.max(1, Math.min(30, (e.count | 0 || 1) * mult));
  for (let i = 0; i < n; i++) setTimeout(() => onGiftOne({ ...e, count: 1 }), i * 180);
}
function onGiftOne({ user, avatar, coins = 1, giftName = '' }) {
  if (state !== 'play') return;
  const pic = getPic(user, avatar); addBoard(user, pic, coins); addCoins(user, coins); comboAdd();
  floaters.push({ x: W / 2, y: H - 260, txt: `${user} +${coins}`, t: 1.6, c: '#ffd34d', s: 46 });
  if (/universe|simurq/i.test(giftName) || coins >= 34000) { if (!simurq) startSimurq(user, pic); else nukeQueue.push({ user, pic }); return; }
  if (/lion|şir/i.test(giftName) || coins >= 20000) { nukeQueue.push({ user, pic }); return; }
  // Xüsusi hədiyyələr (ada görə). Siyahıda olmayan hədiyyə coin cədvəli ilə işləyir.
  if (/ice ?cream|dondurma|doughnut|donut/i.test(giftName)) { spawnCavalry(user, pic); return; }
  if (/finger ?heart|barmaq/i.test(giftName)) { SFX.hero(); for (let i = 0; i < 5; i++) setTimeout(() => spawnUnit('az', user, pic), i * 150); return; }
  if (/perfume|ətir/i.test(giftName)) { spawnRam(user, pic); return; }
  if (/galaxy|qalaktika/i.test(giftName)) { arrowRain(user, pic); return; }
  if (coins >= 1000) { for (let i = 0; i < 5; i++) setTimeout(() => fire('rocket', user, pic), i * 350); }

// ================= YENİLƏMƏ =================
function update(dt) {
  introT += dt;
  if (state === 'play') {
    defT += dt; autoT += dt;
    const nd = units.filter(u => u.side === 'en' && !u.dead).length;
    if (defT > CFG.defenderEvery / (rage ? CFG.rageSpawnMul : 1) && nd < (rage ? CFG.rageMaxDefenders : CFG.maxDefenders)) { defT = 0;
      for (let i = 0; i < CFG.defenderGroup; i++) spawnUnit('en', null, null); }
    if (autoT > CFG.autoSoldierEvery) { autoT = 0; spawnUnit('az', null, null); }
    // 3) vaxt limiti
    timeLeft -= dt; roundT += dt;
    // itki qorxusu: uzun müddət zərbə olmasa qala canını bərpa edir
    idleT += dt;
    if (idleT > CFG.regenAfter && lives < CFG.castleLives) { regenOn = true; regenT += dt;
      if (regenT >= CFG.regenEvery) { regenT = 0; lives++;
        floaters.push({ x: W / 2 + (Math.random() - .5) * 200, y: CASTLE.y + 100, txt: '+1 🔧', t: 1.2, c: '#5fe35f', s: 50 }); } }
    else regenOn = false;
    if (timeLeft <= 30 && timeLeft > 0) { heartT -= dt; if (heartT <= 0) { heartT = timeLeft < 10 ? .5 : 1; SFX.heart(); } }
    if (timeLeft <= 0) { state = 'failed'; stateT = 0; SFX.fail(); }
    // 2) qala cavab atəşi
    if (!nuke) {
      if (stage >= 1) { archerT -= dt; if (archerT <= 0) { archerT = CFG.archerEvery; archerShoot(); } }
      if (stage >= 2) { rageT -= dt;
        if (rageT <= 0) { const k = lives / CFG.stageCannons;
          rageT = CFG.rageEvery[1] + (CFG.rageEvery[0] - CFG.rageEvery[1]) * k; castleFire(); } }
      if (stage >= 3 && !tanks.length) { tankT += dt; if (tankT > CFG.tankRespawn) { tankT = 0; spawnTank(); } }
    }
    updTanks(dt);
    rageBanner = Math.max(0, rageBanner - dt);
  } else if (state === 'failed') { stateT += dt; if (stateT > 4) { const r = round; reset(); round = r; } }
  else updCaptured(dt);

  for (const u of units) {
    if (u.dead) continue;
    u.cd -= dt; u.swing = Math.max(0, u.swing - dt * 4);
    let foe = null, fd = 1e9;
    for (const o of units) if (!o.dead && o.side !== u.side) { const d = Math.hypot(o.x - u.x, o.y - u.y); if (d < fd) { fd = d; foe = o; } }
    if (foe && fd < 55) {                              // qılınc döyüşü
      if (u.cd <= 0) { u.cd = .8; u.swing = 1; SFX.sword(); sparks((u.x + foe.x) / 2, (u.y + foe.y) / 2 - 60); foe.hp -= u.side === 'az' ? ((u.pic && !u.chat) ? 2 : 1) * furyMul() : 1; if (foe.hp <= 0) killUnit(foe, u.name); }
    } else if (u.side === 'az' && u.y <= GATE_Y + 15) { // qalanı vur
      if (u.cd <= 0) { u.cd = 1; u.swing = 1; hitCastle(((u.pic && !u.chat) ? 2 : 1) * furyMul(), u.name); u.hp--; if (u.hp <= 0) killUnit(u); }
    } else {
      let tx = foe && fd < 260 ? foe.x : u.x, ty = foe && fd < 260 ? foe.y : (u.side === 'az' ? GATE_Y : H - 80);

function drawShots() {

    if (s.kind === 'rarrow') { const a = Math.atan2(s.ty - s.y, s.tx - s.x);
      ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(10, 0); ctx.stroke(); ctx.fillStyle = '#9fe3ff';
      ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(6, -7); ctx.lineTo(6, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(-42, -5, 10, 10); ctx.restore(); continue; }
    if (s.kind === 'tshell') { ctx.fillStyle = '#ffde59'; ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.fill();
      parts.push({ x, y, vx: 0, vy: 0, t: .2, c: '#ffae00', conf: 1, sz: 10 }); continue; }
    if (s.kind === 'earrow') { const ay = y - Math.sin(Math.PI * s.t) * 120, a = Math.atan2(s.ty - s.y, s.tx - s.x);
      ctx.save(); ctx.translate(x, ay); ctx.rotate(a); ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(10, 0); ctx.stroke();

    if (s.kind === 'eball') { const cy = s.y + (s.ty - s.y) * s.t - Math.sin(Math.PI * s.t) * 180;

let last = null, frameDt = .016;
function loop(now) {
  requestAnimationFrame(loop);   // əvvəlcə növbəti kadrı sifariş et — bir kadrda xəta olsa da oyun donmasın
  if (last === null) last = now;
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; frameDt = dt;   // mənfi dt olmasın
  try { update(dt); draw(); } catch (e) { console.error(e); }

// Bridge üçün: ws://localhost:8080 -> {type:'gift', user, avatar, coins, giftName} | {type:'like', user}
// Bridge-ə qoşulma: bridge sonra açılsa da, qopsa da 3 saniyədən bir yenidən cəhd edir
let bridgeState = 'off';   // off | waiting | connected | test
(function connectBridge() {
  let ws;
  try { ws = new WebSocket('ws://localhost:8080'); } catch (_) { return setTimeout(connectBridge, 3000); }
  ws.onopen = () => { bridgeState = 'waiting'; };
  ws.onmessage = m => { let e; try { e = JSON.parse(m.data); } catch (_) { return; }
    if (e.type === 'gift') onGift(e); else if (e.type === 'like') onLike(e.user);
    else if (e.type === 'follow') onFollow(e); else if (e.type === 'share') onShare(e); else if (e.type === 'chat') onChat(e); else if (e.type === 'join') onJoin(e);
    else if (e.type === 'status') bridgeState = e.tiktok; };
  ws.onclose = () => { bridgeState = 'off'; setTimeout(connectBridge, 3000); };
  ws.onerror = () => {};
})();
